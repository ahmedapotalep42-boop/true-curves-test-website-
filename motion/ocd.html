<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OCD Motion Clips</title>
<style>
  :root{
    --ink:#121212; --mute:#6B6B6B; --bg:#FFFFFF; --soft:#F3F3F1; --soft-d:#DAD9D4;
    --yellow:#F7C325; --yellow-d:#C99A0E;
    --coral:#F47C6E; --coral-d:#C9564A;
    --magenta:#E2245F; --magenta-d:#A8123F;
    --teal:#1FA6A0; --teal-d:#137571;
    --blue:#2F7FD1; --blue-d:#1D5A9C;
    --green:#2FA35A; --green-d:#1E7840;
    --amber:#F5A623; --amber-d:#C27C0B;
    --red:#EF5A5A; --red-d:#B93838;
    --violet:#6A4FC9; --violet-d:#4A3496;
    --gray:#9A9A96; --gray-d:#6F6F6B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);
    font-family:Inter,"Inter Display",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{position:absolute;inset:0;perspective:2200px;overflow:hidden}
  .cam{position:absolute;inset:0;transform-origin:50% 50%}
  .abs{position:absolute}
  .card{position:absolute;transform-style:preserve-3d}
  .face{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
  .face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(120% 80% at 18% 0%,rgba(255,255,255,.38),rgba(255,255,255,0) 55%)}
  .floor{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.18),rgba(0,0,0,0))}
  .title{font-weight:400;letter-spacing:-.025em;line-height:1.04}
  .title b{font-weight:800}
  .cap{font-weight:500;color:var(--mute);letter-spacing:-.01em}
  .chip{display:inline-flex;align-items:center;gap:14px;font-weight:700;border-radius:999px;padding:16px 32px;white-space:nowrap}
  svg{overflow:visible}
</style>
</head>
<body>
<div id="stage"><div class="cam" id="cam"></div></div>
<script src="engine.js"></script>
<script>
/* ================= scene: two key elements ================= */
function twoCards(o){
  const R=root();
  const title=h('div',{class:'title abs',style:{left:0,right:0,top:'110px',textAlign:'center',fontSize:'84px'},html:'Two key <b>elements</b>'},R);
  const defs=[['yellow','1','Obsessions','#121212',iconHead],['magenta','2','Compulsions','#fff',iconCheck]];
  const cards=defs.map(([c,n,lab,ink,ic],i)=>{const sl=slab(R,{x:960+(i?320:-320),y:590,w:500,h:500,color:C(c),dark:C(c+'-d'),radius:52,depth:16});
    h('div',{class:'abs',style:{left:'40px',top:'34px',fontSize:'40px',fontWeight:800,color:ink,opacity:.55},html:n},sl.face);
    const svg=s('svg',{viewBox:'-20 -20 240 240',width:270,height:270,style:'position:absolute;left:115px;top:60px'},sl.face);const icn=ic(svg,ink);
    h('div',{class:'abs',style:{left:0,right:0,top:'360px',textAlign:'center',fontSize:'58px',fontWeight:800,letterSpacing:'-.02em',color:ink},html:lab},sl.face);
    return{sl,icn}});
  return t=>{reveal(title,eOut(seg(t,o.titleAt,o.titleAt+.5)));
    cards.forEach((c,i)=>{slabIn(c.sl,t,o.at[i]);
      if(i===0){draw(c.icn.head,1);draw(c.icn.scrib,eInOut(seg(t,o.at[0]+.3,o.at[0]+1.4)))}
      else{draw(c.icn.box,1);draw(c.icn.tick,1);draw(c.icn.ring,eInOut(seg(t,o.at[1]+.3,o.at[1]+1)));c.icn.hd.style.opacity=seg(t,o.at[1]+.9,o.at[1]+1)}});
    const f=eInOut(seg(t,o.focus,o.focus+.6));
    cards[0].sl.card.style.transform=`translateZ(${f*120}px) translateX(${f*120}px)`;
    cards[1].sl.card.style.transform=`translateX(${f*80}px)`;cards[1].sl.wrap.style.opacity=lerp(1,.3,f)*clamp((t-o.at[1])/.18);
    title.style.opacity=(1-f*.6)*eOut(seg(t,o.titleAt,o.titleAt+.5));camPush(t,.006)}}

/* ================= scene: thought vs anxiety ================= */
function versus(o){
  const R=root();
  const kick=h('div',{class:'cap abs',style:{left:0,right:0,top:'160px',textAlign:'center',fontSize:'52px'},html:'The real problem'},R);
  const a=slab(R,{x:560,y:540,w:600,h:300,color:'#FFFFFF',dark:C('soft-d'),radius:60,depth:14});a.face.style.border='3px solid #ECEBE7';
  h('div',{class:'abs',style:{inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'68px',fontWeight:800,color:'#9A9A96',letterSpacing:'-.02em'},html:'The thought'},a.face);
  const sv=s('svg',{width:600,height:300,style:'position:absolute;left:0;top:0'},a.card);const st=drawable(s('path',{d:'M90 150 L510 150',stroke:C('red'),'stroke-width':14,'stroke-linecap':'round'},sv));
  const b=slab(R,{x:1360,y:540,w:640,h:340,color:C('coral'),dark:C('coral-d'),radius:64,depth:18});
  h('div',{class:'abs',style:{inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',fontSize:'52px',color:'#121212',textAlign:'center',lineHeight:1.05},html:'The<br><b style="font-size:84px;letter-spacing:-.03em">anxiety</b>it creates'},b.face);
  const lab=h('div',{class:'chip abs',style:{left:'960px',top:'850px',fontSize:'40px',background:'#121212',color:'#fff',boxShadow:extrude('#000',6,.2)},html:'&larr;&nbsp; not this &nbsp;&middot;&nbsp; this &nbsp;&rarr;'},R);
  return t=>{reveal(kick,eOut(seg(t,0,.5)));slabIn(a,t,o.a);draw(st,eOut(seg(t,o.strike,o.strike+.3)));
    a.wrap.style.opacity=clamp((t-o.a)/.18)*lerp(1,.55,seg(t,o.strike,o.strike+.5));
    slabIn(b,t,o.b);const f=eOut(seg(t,o.b+.5,o.b+1));b.card.style.transform=`scale(${1+f*.04})`;
    pop(lab,eBack(seg(t,o.b+.6,o.b+1),1.5),'translateX(-50%)');camPush(t,.006)}}

/* ================= scene: the OCD cycle ================= */
function cycle(o){
  const R=root(),CX=960,CY=540,RX=560,RY=330;
  const svg=s('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},R);
  const ring=s('ellipse',{cx:CX,cy:CY,rx:RX,ry:RY,fill:'none',stroke:'#1A1A1A','stroke-width':4,'stroke-dasharray':'2 14','stroke-linecap':'round'},svg);
  const comet=s('path',{fill:'none','stroke-width':10,'stroke-linecap':'round'},svg);
  const dot=s('circle',{r:16,fill:'#121212'},svg);
  const defs=[['yellow','Unwanted','obsession','#121212'],['coral','Intense','anxiety','#121212'],['magenta','Physical / mental','compulsion','#fff'],['teal','Temporary','relief','#fff']];
  const angs=[-90,0,90,180];
  const pt=d=>{const r=d*Math.PI/180;return[CX+Math.cos(r)*RX,CY+Math.sin(r)*RY]};
  const cards=defs.map(([c,a,b,ink],i)=>{const[x,y]=pt(angs[i]);const sl=slab(R,{x,y,w:310,h:250,color:C(c),dark:C(c+'-d'),radius:40,depth:12,floor:false});
    h('div',{class:'title abs',style:{inset:0,display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',fontSize:'34px',color:ink,textAlign:'center'},html:`${a}<br><b style="font-size:44px">${b}</b>`},sl.face);
    return{sl,c:C(c),y}});
  const titles=o.titles.map(([html,at,col])=>({at,el:h('div',{class:'title abs',style:{left:0,right:0,top:'450px',textAlign:'center',fontSize:'100px',color:col||'#121212'},html:`<b>${html}</b>`},R)}));
  const laps=o.laps;
  return t=>{
    const kr=eOut(seg(t,0,.6));ring.style.opacity=kr;
    let ph=null;for(let i=0;i<laps.length-1;i++)if(t>=laps[i]&&t<laps[i+1]){ph={lap:i,f:(t-laps[i])/(laps[i+1]-laps[i])}}
    if(t>=laps[laps.length-1])ph={lap:laps.length-2,f:1,end:true};
    let cur=-999;
    if(ph&&!ph.end){cur=-90+ph.f*360;const L=40+ph.lap*14;const pts=[];for(let k=0;k<=24;k++)pts.push(pt(cur-L*(1-k/24)));
      comet.setAttribute('d','M'+pts.map(p=>p.join(',')).join(' L'));
      const sec=Math.floor(((((cur+90)%360)+360)%360)/90);comet.setAttribute('stroke',cards[sec].c);
      const[x,y]=pt(cur);dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.style.opacity=1;comet.style.opacity=1;
      comet.setAttribute('stroke-width',8+ph.lap*4);dot.setAttribute('r',12+ph.lap*3);ring.setAttribute('stroke-width',4+ph.lap*1.5)}
    else{dot.style.opacity=0;comet.style.opacity=0}
    cards.forEach((cd,i)=>{const at=o.cards[i];const k=spring(seg(t,at,at+.8));const depth=(cd.y-CY)/RY;let lift=0;
      if(cur>-999){const d=Math.abs(((cur-angs[i])%360+540)%360-180);lift=clamp(1-d/40)}
      cd.sl.wrap.style.opacity=clamp((t-at)/.15);cd.sl.wrap.style.zIndex=Math.round(10+depth*5);
      cd.sl.wrap.style.transform=`perspective(1800px) translateY(${lerp(80,0,k)-lift*24}px) rotateX(${lerp(60,6,k)}deg) scale(${lerp(.3,1,k)*(1+depth*.05)*(1+lift*.1)})`});
    titles.forEach((ti,i)=>{const kin=eOut(seg(t,ti.at,ti.at+.5));const nx=titles[i+1];const kout=nx?eOut(seg(t,nx.at,nx.at+.35)):0;
      ti.el.style.opacity=kin*(1-kout);ti.el.style.transform=`scale(${lerp(1.12,1,kin)*(1-kout*.08)})`;ti.el.style.filter=`blur(${(1-kin)*10+kout*10}px)`});
    camPush(t,.008)}}

/* ================= scene: brain loop ================= */
function brain(o){
  const R=root(),T=o.t;
  const bw=h('div',{class:'abs',style:{left:'90px',top:'170px',width:'960px',height:'780px',transformStyle:'preserve-3d'}},R);
  const svg=s('svg',{viewBox:'40 20 560 460',width:960,height:780,style:'position:absolute;left:0;top:0'},bw);
  const defs=s('defs',{},svg);
  const cerebrum='M120 300 C70 282 58 212 92 166 C108 102 178 56 262 60 C334 40 424 60 474 122 C522 152 542 212 522 262 C512 302 482 322 442 326 L400 330 C380 346 350 350 330 346 L300 340 C260 352 200 346 170 332 C150 322 132 312 120 300 Z';
  const cp=s('clipPath',{id:'cb'},defs);s('path',{d:cerebrum},cp);
  s('ellipse',{cx:320,cy:470,rx:230,ry:18,fill:'rgba(0,0,0,.10)'},svg);
  s('path',{d:'M318 330 C322 380 330 420 336 462 L382 462 C376 420 372 380 372 330 Z',fill:'#F2C9C4',stroke:'#D49C96','stroke-width':4},svg);
  const cbl=s('g',{},svg);s('ellipse',{cx:438,cy:352,rx:76,ry:46,fill:'#F0BFC0',stroke:'#D49C96','stroke-width':4},cbl);
  for(let i=0;i<4;i++)s('path',{d:`M${376+i*4} ${336+i*10} C 420 ${326+i*12} 470 ${330+i*12} 506 ${340+i*8}`,fill:'none',stroke:'#D49C96','stroke-width':3},cbl);
  const body=s('path',{d:cerebrum,fill:'#F8D9D6',stroke:'#D49C96','stroke-width':5},svg);
  const cortexFill=s('path',{d:'M40 20 L250 20 C230 120 220 200 250 360 L40 360 Z',fill:C('blue'),'clip-path':'url(#cb)'},svg);
  const gyri=s('g',{fill:'none',stroke:'rgba(0,0,0,.14)','stroke-width':4,'stroke-linecap':'round','clip-path':'url(#cb)'},svg);
  const r=rng(11);for(let i=0;i<16;i++){const x=90+r()*420,y=90+r()*220;s('path',{d:`M${x} ${y} q ${14+r()*20} ${-20+r()*10} ${30+r()*20} ${r()*14-7} t ${30+r()*20} ${r()*14-7}`},gyri)}
  const outline=drawable(s('path',{d:cerebrum,fill:'none',stroke:'#C98E88','stroke-width':6},svg));
  const stri=s('path',{d:'M250 238 C220 190 250 132 312 128 C362 126 392 160 388 196',fill:'none',stroke:C('green'),'stroke-width':34,'stroke-linecap':'round'},svg);
  const strIn=s('path',{d:'M262 230 C246 196 262 156 312 154 C346 154 364 176 364 196',fill:'none',stroke:'#E3D7B8','stroke-width':16,'stroke-linecap':'round'},svg);
  const thal=s('ellipse',{cx:324,cy:236,rx:46,ry:30,fill:C('amber'),stroke:C('amber-d'),'stroke-width':4},svg);
  const loop=s('path',{d:'M170 170 C200 110 290 96 330 140 C370 180 360 220 330 236 C290 262 230 300 180 270 C140 246 140 210 170 170',fill:'none',stroke:'#FFFFFF','stroke-width':10,'stroke-linecap':'round','stroke-dasharray':'26 22',opacity:.9},svg);
  const loopL=loop.getTotalLength();
  const sig=s('circle',{r:14,fill:'#fff',stroke:C('red'),'stroke-width':6},svg);
  function label(x,y,lx,ly,col,dark,t1,t2){const g=s('g',{},svg);
    const ln=drawable(s('path',{d:`M${x} ${y} L${lx} ${ly}`,stroke:col,'stroke-width':4,fill:'none'},g));
    s('circle',{cx:x,cy:y,r:9,fill:'#fff',stroke:col,'stroke-width':5},g);
    const bx=s('g',{},g);const w=Math.max(t1.length*17,t2.length*11.5)+44;
    s('rect',{x:lx-w/2,y:ly-38,width:w,height:76,rx:20,fill:col,style:`filter:drop-shadow(0 6px 0 ${dark}) drop-shadow(0 16px 18px rgba(0,0,0,.18))`},bx);
    const a=s('text',{x:lx,y:ly-2,'text-anchor':'middle','font-size':28,'font-weight':800,fill:'#fff','font-family':'Inter'},bx);a.textContent=t1;
    const b=s('text',{x:lx,y:ly+26,'text-anchor':'middle','font-size':19,'font-weight':500,fill:'#fff','font-family':'Inter'},bx);b.textContent=t2;
    return{g,ln,bx,lx,ly}}
  const L1=label(150,250,170,420,C('blue'),C('blue-d'),'Cortex','thinking · alarm');
  const L2=label(372,160,470,96,C('green'),C('green-d'),'Striatum','filter / gatekeeper');
  const L3=label(366,248,480,286,C('amber'),C('amber-d'),'Thalamus','relay / green light');
  const list=h('div',{class:'abs',style:{left:'1110px',top:'190px',width:'740px'}},R);
  const head=h('div',{class:'title',style:{fontSize:'60px',marginBottom:'34px'},html:'<b>A loop in the brain</b>'},list);
  const st=[[C('blue'),'Cortex','Thoughts &amp; detecting threats'],[C('green'),'Striatum','Filters signals &mdash; less effective in OCD'],
    [C('amber'),'Thalamus','Relays the &ldquo;green light&rdquo; back'],[C('violet'),'The loop','May contribute to OCD']].map(([c,t1,t2],i)=>{
    const row=h('div',{style:{display:'flex',gap:'26px',alignItems:'flex-start',marginBottom:'30px'}},list);
    h('div',{style:{flex:'0 0 64px',height:'64px',borderRadius:'50%',background:c,color:'#fff',fontWeight:800,fontSize:'32px',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:extrude('rgba(0,0,0,.25)',5,.15)},html:String(i+1)},row);
    const tx=h('div',{},row);h('div',{style:{fontSize:'40px',fontWeight:800,letterSpacing:'-.01em'},html:t1},tx);
    h('div',{class:'cap',style:{fontSize:'30px',marginTop:'6px',lineHeight:1.25},html:t2},tx);return row});
  // signal path fractions keyed to words
  const keys=[[0,0],[T.cortex,0],[T.striatum,.3],[T.thalamus-.1,.3],[T.thalamus+.3,.52],[T.loop,.52],[T.loop+.8,1]];
  function along(t){if(t<keys[keys.length-1][0]){for(let i=1;i<keys.length;i++)if(t<keys[i][0]){const[a,fa]=keys[i-1],[b,fb]=keys[i];return lerp(fa,fb,eInOut(clamp((t-a)/(b-a))))}}
    const p=t-keys[keys.length-1][0];return(1+p/1.0+p*p*.15)%1}
  return t=>{
    const kb=spring(seg(t,0,1));bw.style.transform=`perspective(2200px) rotateY(${lerp(-30,-6,kb)+Math.sin(t*.8)*2}deg) rotateX(${lerp(14,3,kb)}deg) scale(${lerp(.75,1,kb)}) translateY(${Math.sin(t*1.3)*6}px)`;
    bw.style.opacity=clamp(t/.3);draw(outline,eInOut(seg(t,0,1)));body.style.opacity=seg(t,.3,.9);gyri.style.opacity=seg(t,.6,1.1);
    const act=a=>clamp(seg(t,a,a+.3));
    cortexFill.style.opacity=.3+.7*act(T.cortex);stri.style.opacity=.3+.7*act(T.striatum);strIn.style.opacity=stri.style.opacity;thal.style.opacity=.35+.65*act(T.thalamus);
    loop.style.opacity=.9*seg(t,T.cortex,T.cortex+.4);loop.style.strokeDashoffset=-t*(t>T.loop?140:50);
    const p=loop.getPointAtLength(along(t)*loopL);sig.setAttribute('cx',p.x);sig.setAttribute('cy',p.y);sig.style.opacity=seg(t,T.cortex,T.cortex+.3);
    [[L1,T.cortex],[L2,T.striatum],[L3,T.thalamus]].forEach(([L,a])=>{draw(L.ln,eOut(seg(t,a,a+.3)));L.g.style.opacity=seg(t,a,a+.1);
      const k=eBack(seg(t,a+.1,a+.45),1.6);L.bx.setAttribute('transform',`translate(${L.lx} ${L.ly}) scale(${Math.max(0,k)}) translate(${-L.lx} ${-L.ly})`)});
    reveal(head,eOut(seg(t,.3,.9)),20);
    const starts=[T.cortex,T.striatum,T.thalamus,T.loop];
    st.forEach((row,i)=>{const k=eOut(seg(t,starts[i],starts[i]+.45));const n=starts.filter(x=>t>=x).length-1;
      row.style.opacity=k*(i===n?1:.42);row.style.transform=`translateX(${(1-k)*40}px)`;row.style.filter=k<1?`blur(${(1-k)*6}px)`:'none'});
    camPush(t,.004)}}

/* ================= scene: false-alarm flow ================= */
function flow(o){
  const R=root(),X=620,ys=[170,390,610,830],T=o.t;
  const defs=[['red','False alarm','even if it&rsquo;s not a real threat',T.alarm],['blue','Cortex','thoughts / doubts',T.chain],['green','Striatum','filter &mdash; less effective',T.chain+.35],['amber','Thalamus','green light',T.chain+.7]];
  const svg=s('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},R);
  const arrows=[0,1,2].map(i=>{const g=s('g',{},svg);const p=drawable(s('path',{d:`M${X} ${ys[i]+66} L${X} ${ys[i+1]-74}`,stroke:'#1A1A1A','stroke-width':6,'stroke-linecap':'round',fill:'none'},g));
    const hd=s('path',{d:`M${X-16} ${ys[i+1]-90} L${X} ${ys[i+1]-72} L${X+16} ${ys[i+1]-90}`,stroke:'#1A1A1A','stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round',fill:'none'},g);return{p,hd,at:i?defs[i+1][3]-.2:T.alarm+.2}});
  const back=drawable(s('path',{d:`M${X-250} ${ys[3]} C ${X-420} ${ys[3]} ${X-420} ${ys[1]} ${X-270} ${ys[1]}`,stroke:C('violet'),'stroke-width':8,'stroke-linecap':'round',fill:'none'},svg));
  const backHd=s('path',{d:`M${X-292} ${ys[1]-18} L${X-268} ${ys[1]} L${X-292} ${ys[1]+18}`,stroke:C('violet'),'stroke-width':8,'stroke-linecap':'round','stroke-linejoin':'round',fill:'none'},svg);
  const pulse=s('circle',{r:14,fill:C('violet')},svg);
  const pills=defs.map(([c,a,b,at],i)=>{const el=h('div',{class:'abs',style:{left:X-240+'px',top:ys[i]-62+'px',width:'480px',height:'124px',borderRadius:'62px',
    background:C(c),color:'#fff',textAlign:'center',display:'flex',flexDirection:'column',justifyContent:'center',boxShadow:extrude(C(c+'-d'),12,.22)},
    html:`<div style="font-size:44px;font-weight:800;letter-spacing:-.01em">${a}</div><div style="font-size:24px;font-weight:500;opacity:.92">${b}</div>`},R);
    h('div',{class:'abs',style:{inset:0,borderRadius:'inherit',background:'radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.35),rgba(255,255,255,0) 55%)'}},el);return{el,at}});
  const right=h('div',{class:'abs',style:{left:'1110px',top:'340px',width:'740px'}},R);
  const lines=o.lines.map(([t,at],i)=>({at,el:h('div',{class:'title',style:{fontSize:i?'64px':'78px',fontWeight:i?500:800,marginBottom:'18px',color:i?'#121212':C('violet')},html:t},right)}));
  return t=>{
    const ph=t>T.loop?((t-T.loop)*(1+(t-T.loop)*.3))%1:-1;
    pills.forEach((p,i)=>{const k=spring(seg(t,p.at,p.at+.8));let glow=0;if(ph>=0)glow=(1+Math.floor(ph*3))===i?1:0;
      p.el.style.transform=`perspective(1200px) translateY(${(1-k)*80-glow*10}px) rotateX(${lerp(70,0,k)}deg) scale(${lerp(.6,1,k)*(1+glow*.05)})`;p.el.style.opacity=clamp(k*3)});
    arrows.forEach((a,i)=>{const at=i===0?T.alarm+.3:pills[i+1].at-.1;draw(a.p,eOut(seg(t,at,at+.35)));a.hd.style.opacity=seg(t,at+.3,at+.35)});
    draw(back,eInOut(seg(t,T.back,T.back+.6)));backHd.style.opacity=seg(t,T.back+.5,T.back+.6);
    if(ph>=0){const pt=back.getPointAtLength(back._L*ph);pulse.setAttribute('cx',pt.x);pulse.setAttribute('cy',pt.y);pulse.style.opacity=1}else pulse.style.opacity=0;
    lines.forEach(l=>{const k=eOut(seg(t,l.at,l.at+.5));l.el.style.opacity=k;l.el.style.transform=`translateX(${(1-k)*40}px)`;l.el.style.filter=k<1?`blur(${(1-k)*8}px)`:'none'});
    camPush(t,.006)}}

/* ================= scene: speech bubbles (reassurance) ================= */
function bubbles(o){
  const R=root();
  const mk=(y,c,dark,ink,mark,markCol,txt)=>{const sl=slab(R,{x:900,y,w:1240,h:250,color:c,dark,radius:60,depth:14,floor:false});
    if(c==='#FFFFFF')sl.face.style.border='3px solid #ECEBE7';

/* ================= scene: medication volume ================= */
function volume(o){
  const R=root();
  const title=h('div',{class:'title abs',style:{left:0,right:0,top:'120px',textAlign:'center',fontSize:'84px'},html:'<b>Medication</b> may help'},R);
  const sub=h('div',{class:'cap abs',style:{left:0,right:0,top:'230px',textAlign:'center',fontSize:'50px'},html:'turn the volume <b style="color:#121212">down</b>'},R);
  const sl=slab(R,{x:960,y:590,w:1100,h:300,color:'#FFFFFF',dark:C('soft-d'),radius:150,depth:16});sl.face.style.border='3px solid #ECEBE7';
  const sp=icon(sl.face,'speaker',{size:150,color:'#121212',sw:6,x:70,y:75});
  const waves=s('g',{fill:'none',stroke:'#121212','stroke-width':6,'stroke-linecap':'round'},sp.svg);
  const wv=[s('path',{d:'M64 38 a16 16 0 0 1 0 24'},waves),s('path',{d:'M72 28 a28 28 0 0 1 0 44'},waves),s('path',{d:'M80 18 a40 40 0 0 1 0 64'},waves)];
  const N=14,bars=[];for(let i=0;i<N;i++)bars.push(h('div',{class:'abs',style:{left:300+i*52+'px',bottom:'70px',width:'34px',borderRadius:'10px',background:C('violet')}},sl.face));
  const chips=o.chips.map(([txt,at,c])=>({at,el:h('div',{class:'chip',style:{fontSize:'40px',background:C(c),color:'#fff',boxShadow:extrude(C(c+'-d'),6,.2)},html:txt})}));
  const row=h('div',{class:'abs',style:{left:0,right:0,top:'870px',display:'flex',justifyContent:'center',gap:'28px',alignItems:'center'}},R);
  chips.forEach((x,i)=>{row.appendChild(x.el)});
  return t=>{reveal(title,eOut(seg(t,0,.5)));reveal(sub,eOut(seg(t,o.turn,o.turn+.5)));
    slabIn(sl,t,.1,{rx0:60,ry0:0});sp.draw(eInOut(seg(t,.3,1)));
    const lvl=lerp(1,.25,eInOut(seg(t,o.down,o.down+1.2)));
    bars.forEach((b,i)=>{const on=(i+1)/N<=lvl+.001;const hgt=40+i*9;const k=eOut(seg(t,.4+i*.03,.8+i*.03));
      b.style.height=hgt*k+'px';b.style.background=on?C('violet'):'#E6E4F0'});
    wv.forEach((w,i)=>w.style.opacity=(i/3)<lvl-.05?1:.12);
    chips.forEach(x=>pop(x.el,eBack(seg(t,x.at,x.at+.35),1.8)));camPush(t,.004)}}

  const R=root(),T=o.t;

    draw(bst,eOut(seg(t,T.not-.1,T.not+.2)));draw(dst,eOut(seg(t,T.not,T.not+.3)));

  }}
